# iamwsll personal Mihomo / Clash base profile
# This file intentionally contains only stable client-side behavior.
# Proxies, proxy-groups, rule-providers and routing rules are generated by sublink-worker.

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
ipv6: true
mode: rule
log-level: info

hosts:
  dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
  doh.pub:
    - 1.12.12.12
    - 120.53.53.53
  dot.pub:
    - 1.12.12.12
    - 120.53.53.53
  cloudflare-dns.com:
    - 104.16.248.249
    - 104.16.249.249
  dns.google:
    - 8.8.8.8
    - 8.8.4.4
  dns.quad9.net:
    - 9.9.9.9
    - 149.112.112.112

dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  listen: 127.0.0.1:53

  # Real-IP mode is intentional. FakeIP can break developer tools that
  # reject 198.18.0.0/16 or otherwise require a public resolved address.
  enhanced-mode: redir-host

  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false

  # Bootstrap DNS. Keep this independent from the system resolver.
  default-nameserver:
    - https://223.5.5.5/dns-query#skip-cert-verify=true
    - https://1.12.12.12/dns-query#skip-cert-verify=true

  # Resolve proxy node hostnames through domestic encrypted DNS to avoid
  # a DNS -> proxy -> DNS dependency loop.
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # Re-resolve DIRECT traffic using domestic encrypted DNS.
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: false

  # Foreign resolvers obey routing rules; domestic resolvers remain available
  # as stable fallbacks. There is deliberately no system-DNS fallback.
  nameserver:
    - https://cloudflare-dns.com/dns-query#RULES
    - https://dns.google/dns-query#RULES
    - https://dns.quad9.net/dns-query#RULES
    - https://doh.pub/dns-query
    - tls://dot.pub:853
    - https://dns.alidns.com/dns-query
    - tls://dns.alidns.com:853

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true

  # Keep Tailscale/control-plane traffic outside Mihomo routing.
  exclude-interface:
    - tailscale0
  route-exclude-address:
    - 100.64.0.0/10
    - 192.200.0.0/24

# Generated dynamically by sublink-worker.
proxies: []
proxy-groups: []
rule-providers: {}
rules: []
