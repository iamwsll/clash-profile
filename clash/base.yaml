# iamwsll personal Mihomo / Clash base profile
# Stable client-side behavior only.
# Proxies, proxy-groups, rule-providers and routing rules are generated by sublink-worker.

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
ipv6: true
mode: rule
log-level: info

dns:
  enable: true
  cache-algorithm: arc
  ipv6: true

  # FakeIP is intentional. Domains that must keep real IPs belong in
  # fake-ip-filter below.
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - "*.msftncsi.com"
    - www.msftconnecttest.com
    - "+.tailscale.net"
    - "+.ts.net"

  # respect-rules requires proxy-server-nameserver.
  # prefer-h3 stays disabled, as recommended by the Mihomo docs when
  # respect-rules is enabled.
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false

  # Bootstrap resolvers. Mihomo's official quick example uses encrypted DNS
  # directly by IP here, avoiding a DNS-server-domain bootstrap dependency.
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6

  # Resolve proxy node hostnames with domestic encrypted DNS.
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # Tailscale MagicDNS should bypass public resolvers and return real tailnet IPs.
  nameserver-policy:
    "+.ts.net": 100.100.100.100

  # Domestic encrypted DNS only. No foreign fallback resolvers.
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true

  # Do not hard-code tailscale0 here:
  # Linux commonly uses tailscale0, while macOS uses utun interfaces whose
  # number can change. Excluding the tailnet address space is portable.
  route-exclude-address:
    - 100.64.0.0/10
    - 192.200.0.0/24

# Generated dynamically by sublink-worker.
proxies: []
proxy-groups: []
rule-providers: {}
rules: []
